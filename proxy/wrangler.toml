name = "cue-proxy"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
# Pages allowed to call the proxy (comma-separated).
ALLOWED_ORIGINS = "https://elenabli.github.io,http://localhost:4173,http://127.0.0.1:4173"
# Requests allowed per day without an invite code: in total, and per address.
# A long play is read in up to 6 parts, one request each (about 5 plays per address).
DAILY_LIMIT = "120"
PER_IP_LIMIT = "30"
# Character voices: letters spoken per day without an invite code (a long play is about 50,000).
VOICE_DAILY_CHARS = "300000"
VOICE_PER_IP_CHARS = "100000"

[[durable_objects.bindings]]
name = "COUNTER"
class_name = "DailyCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DailyCounter"]

# Secrets (set by .github/workflows/proxy.yml from the repository's secrets):
#   ANTHROPIC_API_KEY  key from console.anthropic.com
#   INVITE_CODES       comma-separated codes that skip the daily limits
#   GOOGLE_TTS_KEY     Google Cloud key limited to the Text-to-Speech API
